[workspace]
members = ["crates/oq-core", "crates/oq", "crates/oq-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/agent-harbor/oq"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
oq-core = { path = "crates/oq-core", version = "0.1.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
